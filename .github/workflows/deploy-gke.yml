      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker
          
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER --region $GKE_ZONE
      - name: Extract image tag
        id: image-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=${{ github.sha }}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.IMAGE }}:$TAG" >> $GITHUB_OUTPUT
      - name: Deploy to GKE
        run: |
          # Replace image tag in deployment manifest
          sed -i "s|DOCKER_IMAGE|${{ steps.image-tag.outputs.full_image }}|g" k8s/deployment.yaml
          
          # Apply Kubernetes manifests
          # kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          
          # Update secrets from GitHub Actions secrets
          kubectl create secret generic animal-predict-secret \
            --from-literal=GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}' \
            --from-literal=GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
            --from-literal=NEXTAUTH_SECRET='${{ secrets.NEXTAUTH_SECRET }}' \
            -n animal-app-namespace \
            --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          
          # Wait for rollout
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n animal-app-namespace --timeout=5m
      - name: Verify deployment
        run: |
          kubectl get deployments -n animal-app-namespace
          kubectl get services -n animal-app-namespace
          kubectl get pods -n animal-app-namespace
      - name: Post deployment info
        if: success()
        run: |
          echo "✅ Deployment successful"
          echo "Cluster: $GKE_CLUSTER"
          echo "Zone: $GKE_ZONE"
          echo "Image: ${{ steps.image-tag.outputs.full_image }}"
          echo "Namespace: animal-app-namespace"